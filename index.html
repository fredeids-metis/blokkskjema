<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blokkskjema for Bergen Private Gymnas - Se hvilke fag som tilbys i hvilke blokker for skoleåret 2026-2027">
  <meta name="theme-color" content="#1F4739">

  <title>Blokkskjema 2026-2027 | Bergen Private Gymnas</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%231F4739'/%3E%3Ctext x='50' y='65' font-family='Georgia' font-size='50' font-weight='bold' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">

  <!-- Adobe Fonts - Jubilat -->
  <link rel="stylesheet" href="https://use.typekit.net/ykp4ufn.css">

  <!-- js-yaml for parsing YAML data (local to avoid tracking prevention) -->
  <script src="js/js-yaml.min.js"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="blokkskjema">
    <!-- Header -->
    <header class="bs-header">
      <div class="container">
        <span class="bs-header__badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          Skoleåret 2026-2027
        </span>
        <h1 class="bs-header__title">Blokkskjema</h1>
        <p class="bs-header__subtitle">
          Se hvilke programfag som tilbys i hvilke blokker.
          Fag i samme blokk har undervisning samtidig og kan ikke kombineres.
        </p>
      </div>
    </header>

    <!-- Controls -->
    <nav class="bs-controls">
      <div class="container">
        <div class="bs-controls__inner">
          <!-- Program Filter Dropdown -->
          <div class="bs-filter-row">
            <div class="bs-filter-dropdown" data-dropdown="program">
              <button class="bs-filter-dropdown__btn" aria-expanded="false" aria-haspopup="listbox">
                <span class="bs-filter-dropdown__label">Program:</span>
                <span class="bs-filter-dropdown__value" id="program-value">Studiespesialisering</span>
                <span class="bs-filter-dropdown__arrow">&#9662;</span>
              </button>
              <div class="bs-filter-dropdown__menu hidden" role="listbox">
                <button class="bs-filter-dropdown__item bs-filter-dropdown__item--active" data-program="studiespesialisering" role="option" aria-selected="true">Studiespesialisering</button>
                <button class="bs-filter-dropdown__item" data-program="musikk-dans-drama" role="option" aria-selected="false">Musikk</button>
                <button class="bs-filter-dropdown__item" data-program="medier-kommunikasjon" role="option" aria-selected="false">Medier og kommunikasjon</button>
              </div>
            </div>

            <div class="bs-filter-divider"></div>

            <!-- Year Filter Dropdown -->
            <div class="bs-filter-dropdown" data-dropdown="year">
              <button class="bs-filter-dropdown__btn" aria-expanded="false" aria-haspopup="listbox">
                <span class="bs-filter-dropdown__label">Trinn:</span>
                <span class="bs-filter-dropdown__value" id="year-value">VG2</span>
                <span class="bs-filter-dropdown__arrow">&#9662;</span>
              </button>
              <div class="bs-filter-dropdown__menu hidden" role="listbox">
                <button class="bs-filter-dropdown__item bs-filter-dropdown__item--active" data-year="vg2" role="option" aria-selected="true">VG2</button>
                <button class="bs-filter-dropdown__item" data-year="vg3" role="option" aria-selected="false">VG3</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="bs-main" id="bs-main">
      <div class="container">
        <div class="bs-blocks-grid" id="bs-blocks-grid">
          <!-- Blocks will be rendered here by JavaScript -->
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bs-footer">
      <div class="container">
        <p class="bs-footer__text">
          Data hentet fra
          <a href="https://github.com/fredeids-metis/school-data" target="_blank" rel="noopener" class="bs-footer__link">
            school-data
          </a>
          &middot; Bergen Private Gymnas
        </p>
      </div>
    </footer>

    <!-- Modal Backdrop -->
    <div class="bs-modal-backdrop" id="bs-modal-backdrop"></div>

    <!-- Modal -->
    <div class="bs-modal" id="bs-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div id="bs-modal-content">
        <!-- Modal content will be rendered by JavaScript -->
      </div>
    </div>
  </div>

  <!-- Application Script -->
  <script src="js/app.js"></script>
</body>
</html>
